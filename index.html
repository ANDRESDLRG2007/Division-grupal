<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>UniSplit 🎓 | Cuentas Claras, Amigos y Roomies</title>
    
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- BLOQUEO ESTRICTO DEL BADGE / CHATBOT INTRUSIVO DE NETLIFY -->
    <style id="block-netlify-badge">
      #netlify-feedback-drawer,
      .netlify-badge,
      [data-netlify-drawer],
      [data-netlify-identity-menu],
      [class*="netlify"],
      [id*="netlify"],
      iframe[src*="netlify"],
      div:has(> iframe[src*="netlify"]),
      div:has(> [data-netlify-drawer]),
      div:has(> .netlify-badge) {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
        opacity: 0 !important;
        max-width: 0 !important;
        max-height: 0 !important;
        width: 0 !important;
        height: 0 !important;
        position: fixed !important;
        top: -99999px !important;
        left: -99999px !important;
        z-index: -99999 !important;
      }
    </style>
    <script>
      // Desactivar y destruir automáticamente cualquier widget inyectado por Netlify
      window.NETLIFY_DISABLE_DRAWER = true;
      try {
        localStorage.setItem('netlify-feedback-drawer-hidden', 'true');
        sessionStorage.setItem('netlify-feedback-drawer-hidden', 'true');
      } catch (e) {}

      // Eliminar elementos inyectados tan pronto aparezcan
      const removeNetlifyBadge = () => {
        const selectors = [
          '#netlify-feedback-drawer',
          '.netlify-badge',
          '[data-netlify-drawer]',
          'iframe[src*="netlify"]',
          '[class*="netlify-drawer"]'
        ];
        selectors.forEach(sel => {
          document.querySelectorAll(sel).forEach(el => el.remove());
        });
      };

      if (typeof MutationObserver !== 'undefined') {
        const observer = new MutationObserver(() => removeNetlifyBadge());
        observer.observe(document.documentElement, { childList: true, subtree: true });
      }
      window.addEventListener('DOMContentLoaded', removeNetlifyBadge);
      window.addEventListener('load', removeNetlifyBadge);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
